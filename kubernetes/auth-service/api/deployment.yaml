apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: loyalty-engine
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/loyaltyengine/loyalty-engine-auth:1.0.0
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          ports:
            - containerPort: 3001
              name: http # Can be used in service instead of port number
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "2048Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
apiVersion: v1
kind: Service
metadata:
  name: coupons-service-db
  namespace: loyalty-engine
spec:
  clusterIP: None # Headless service
  selector:
    app: coupons-service-db # coupons service database statefulset label
  ports:
    - port: 27017
      targetPort: 27017
      name: mongo # Service port name
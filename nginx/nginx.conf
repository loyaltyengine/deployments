events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
    }

    upstream properties_service {
        server properties-service:3002;
    }

    # upstream coupons_service {
    #     server coupons-service:3003;
    # }

    # upstream points_service {
    #     server points-service:3004;
    # }

    server {
        listen 80;
        server_name localhost;

        location /_auth_verify {
            internal;
            proxy_pass http://auth_service/auth/v1/verify-token;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location /auth {
            proxy_pass http://auth_service;
        }

        location /properties-api {
            auth_request /_auth_verify;
            proxy_pass http://properties_service;
        }

        # location /coupons-api {
        #     auth_request /_auth_verify;
        #     proxy_pass http://coupons_service;
        # }

        # location /points-api {
        #     auth_request /_auth_verify;
        #     proxy_pass http://points_service;
        # }
    }
}
